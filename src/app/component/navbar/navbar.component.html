<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap"
  rel="stylesheet"
/>
<body>
  <nav
    class="navbar navbar-expand-lg shadow"
    [attr.data-bs-theme]="temaAtual.temaBody"
    style="color: var(--bs-navbar-color)"
  >
    <div class="container-fluid">
      <a class="nav-link active" aria-current="page" href=""
        ><img src="assets/logo.png" class="logo" alt="Logo principal" href=""
      /></a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" style="font-size: large" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              style="font-size: large"
              routerLink="/search/cards"
              >Pesquisar Carta</a
            >
          </li>
        </ul>
        <div class="d-flex">
          <ul class="navbar-nav">
            <li
              class="nav-item dropdown"
              style="font-size: large; margin-right: 10px"
            >
              <button
                type="button"
                class="nav-link dropdown-toggle current-theme"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <i class="{{ temaAtual.icon }}"></i>
                {{ temaAtual.title }}
              </button>
              <ul
                class="dropdown-menu themes-list"
                data-bs-auto-close="outside"
              >
                <li *ngFor="let theme of themes" (click)="onThemeClick(theme)">
                  <a class="dropdown-item" [attr.data-theme]="theme.temaBody">
                    <i style="margin-right: 5px" class="{{ theme.icon }}"></i
                    >{{ theme.title }}</a
                  >
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>
</body>
