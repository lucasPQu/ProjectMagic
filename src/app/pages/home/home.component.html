<app-detalhes-card-modal #cardModalDetalhes></app-detalhes-card-modal>
<div class="container">
  <div class="vstack gap-3">
    <form [formGroup]="form" (ngSubmit)="onClickSearch()" role="search">
      <input
        id="nameSearchCard"
        class="shadow form-control form-control-lg p-2"
        type="search"
        formControlName="nameSearchCard"
        placeholder="Buscar Carta"
        style="margin-top: 10% !important"
      />
      <div
        *ngIf="errorSearchCard"
        class="shadow alert alert-danger text-danger h-50 w-100 mt-3"
        style="align-items: center"
        role="alert"
      >
        <strong>Carta não Encontrada!</strong>
      </div>
      <div class="m-4 p-2 justify-content-center d-flex">
        <button class="shadow btn btn-primary btn-lg m-2" type="submit">
          Search
        </button>
        <button type="button" class="shadow btn btn-success btn-lg m-2">
          Filtro Avançado
        </button>
      </div>
    </form>
  </div>
</div>

<div *ngIf="this.cardsList.length > 0" class="container mt-4">
  <div class="d-flex justify-content-end mb-3">
    <div class="btn-group" role="group" aria-label="View Toggles">
      <button
        type="button"
        class="btn"
        [class.btn-primary]="visualizacaoAtiva"
        [class.btn-outline-primary]="!visualizacaoAtiva"
        (click)="trocarVisualizacaoLista()"
        title="Visualização em Lista"
      >
        <i class="bi bi-list-ul"></i> Lista
      </button>
      <button
        type="button"
        class="btn"
        [class.btn-primary]="!visualizacaoAtiva"
        [class.btn-outline-primary]="visualizacaoAtiva"
        (click)="trocarVisualizacaoGrade()"
        title="Visualização em Grade"
      >
        <i class="bi bi-grid-3x3-gap-fill"></i> Grade
      </button>
    </div>
  </div>

  <div *ngIf="visualizacaoAtiva" class="card" style="width: auto">
    <div class="card-body">
      <h5 class="card-title">Resultados Busca:</h5>
      <div class="table-responsive">
        <table class="table table-striped-columns">
          <thead>
            <tr>
              <th scope="col">Nome</th>
              <th scope="col">Tipo</th>
              <th scope="col">Identidade de Cor</th>
              <th scope="col">Palavra(s) Chave</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let card of cardsList">
              <td
                (click)="mostrarDetalhesDaCarta(card)"
                style="cursor: pointer"
                data-bs-toggle="tooltip"
                data-bs-html="true"
                data-bs-placement="top"
                data-bs-custom-class="custom-tooltip"
                [attr.data-bs-title]="
                  card.cardImage?.large
                    ? '<img src=' +
                      card.cardImage.large +
                      ' alt=\'' +
                      card.nameCard +
                      '\' width=\'280\' />'
                    : ''
                "
              >
                {{ card.nameCard }}
              </td>
              <td>{{ card.cardType }}</td>
              <td>
                <div class="d-flex align-items-center gap-1">
                  <span
                    *ngFor="let icon of converterParaManaIcons(card.cardColor)"
                    [innerHTML]="icon | safeHtml"
                  >
                  </span>
                </div>
              </td>
              <td>
                <span>
                  {{ card.cardKeywords ? card.cardKeywords.join(", ") : "" }}
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div
    *ngIf="!visualizacaoAtiva"
    class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-3"
  >
    <div *ngFor="let card of cardsList" class="col">
      <div class="card d-flex flex-column shadow-sm">
        <img
          [src]="card.cardImage?.normal || card.cardImage?.large"
          class="card-img-top mx-auto d-block"
          [alt]="card.nameCard"
          (click)="mostrarDetalhesDaCarta(card)"
          style="
            margin-top: 2%;
            object-fit: contain;
            cursor: pointer;
            max-height: 300px;
            max-width: 100%;
            width: auto;
            height: auto;
            border-top-left-radius: var(--bs-card-inner-border-radius);
            border-top-right-radius: var(--bs-card-inner-border-radius);
          "
          [title]="card.nameCard"
        />
        <div class="card-body text-center p-2 w-100">
          <h6 class="card-title medium mb-0">
            {{ card.nameCard }}
          </h6>
        </div>
      </div>
    </div>
  </div>
  <div class="d-flex justify-content-center mt-4" *ngIf="showButtonNextPage">
    <button
      class="shadow btn btn-primary btn-lg m-2"
      (click)="searchNextPage()"
    >
      Carregar Mais
    </button>
  </div>
</div>
